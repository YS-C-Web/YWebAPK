<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>YWEBAPK - Administración</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .admin-page {
            max-width: 900px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .admin-page h1 {
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-page .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .admin-page .logout-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }
        .login-box {
            max-width: 400px;
            margin: 4rem auto;
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .login-box input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .login-box .error {
            color: #ef4444;
            margin-bottom: 0.5rem;
            display: none;
        }
        .message-item {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: left;
        }
        .message-item .msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .message-item .msg-header strong {
            color: var(--text-primary);
        }
        .message-item .msg-body {
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        .message-item .msg-reply {
            margin-top: 0.8rem;
            border-top: 1px solid var(--border);
            padding-top: 0.8rem;
        }
        .message-item .msg-reply textarea {
            width: 100%;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 60px;
        }
        .message-item .msg-reply textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .message-item .reply-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.3rem;
        }
        .message-item .reply-btn:hover {
            background: var(--primary-dark);
        }
        .message-item .replies {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 0.8rem;
            margin-top: 0.5rem;
            border-left: 3px solid var(--primary);
        }
        .message-item .replies p {
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }
        .message-item .replies .reply-date {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }
        .unread-badge {
            background: #ef4444;
            color: white;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .no-messages {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-light);
        }
        .stat-card .label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }
        @media (max-width: 768px) {
            .admin-page { padding: 0.5rem; }
            .stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="admin-page">
        <div id="loginSection" class="login-box">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">🔐 Acceso Admin</h2>
            <div id="adminError" class="error">❌ Contraseña incorrecta</div>
            <input type="password" id="adminPassword" placeholder="Introduce la contraseña" />
            <button onclick="adminLogin()" class="submit-btn">Acceder</button>
        </div>

        <div id="adminPanel" style="display: none;">
            <h1>
                📊 Panel de Administración
                <button onclick="adminLogout()" class="logout-btn">Cerrar sesión</button>
            </h1>
            
            <div class="stats" id="statsContainer">
                <div class="stat-card">
                    <div class="number" id="totalMessages">0</div>
                    <div class="label">Total mensajes</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="unreadMessages">0</div>
                    <div class="label">No leídos</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalReplies">0</div>
                    <div class="label">Respuestas enviadas</div>
                </div>
            </div>

            <div id="messagesList"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        // 🔥 CONFIGURACIÓN DE FIREBASE - CAMBIA ESTO POR TUS DATOS 🔥
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROJECT.firebaseapp.com",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_PROJECT.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allMessages = [];

        function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            // Cambia "admin2026" por la contraseña que quieras
            if (password === 'admin2026') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('adminError').style.display = 'none';
                loadMessages();
            } else {
                document.getElementById('adminError').style.display = 'block';
            }
        }

        function adminLogout() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-ES', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function loadMessages() {
            db.collection('messages')
                .orderBy('date', 'desc')
                .onSnapshot((snapshot) => {
                    allMessages = [];
                    snapshot.forEach((doc) => {
                        allMessages.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    renderMessages();
                    updateStats();
                }, (error) => {
                    console.error('Error al cargar mensajes:', error);
                    document.getElementById('messagesList').innerHTML = 
                        '<p style="color: #ef4444;">Error al cargar los mensajes.</p>';
                });
        }

        function updateStats() {
            const total = allMessages.length;
            const unread = allMessages.filter(m => !m.read).length;
            let replies = 0;
            allMessages.forEach(m => {
                if (m.replies) replies += m.replies.length;
            });
            document.getElementById('totalMessages').textContent = total;
            document.getElementById('unreadMessages').textContent = unread;
            document.getElementById('totalReplies').textContent = replies;
        }

        function renderMessages() {
            const container = document.getElementById('messagesList');
            if (allMessages.length === 0) {
                container.innerHTML = '<div class="no-messages">📭 No hay mensajes aún.</div>';
                return;
            }

            container.innerHTML = allMessages.map(msg => {
                const unreadBadge = !msg.read ? '<span class="unread-badge">Nuevo</span>' : '';
                const repliesHtml = msg.replies && msg.replies.length > 0
                    ? `<div class="replies">${msg.replies.map(r => 
                        `<p><strong>Admin:</strong> ${r.text}</p><span class="reply-date">${formatDate(r.date)}</span>`
                    ).join('')}</div>`
                    : '';

                return `
                    <div class="message-item" id="msg-${msg.id}">
                        <div class="msg-header">
                            <div>
                                <strong>${msg.name}</strong> (${msg.email}) ${unreadBadge}
                            </div>
                            <span>${formatDate(msg.date)}</span>
                        </div>
                        <div class="msg-body">${msg.message}</div>
                        ${repliesHtml}
                        <div class="msg-reply">
                            <textarea id="reply-${msg.id}" placeholder="Escribe tu respuesta..." rows="2"></textarea>
                            <button class="reply-btn" onclick="sendReply('${msg.id}')">Responder</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Marcar como leídos
            allMessages.forEach(msg => {
                if (!msg.read) {
                    db.collection('messages').doc(msg.id).update({ read: true });
                }
            });
        }

        function sendReply(messageId) {
            const textarea = document.getElementById(`reply-${messageId}`);
            const text = textarea.value.trim();
            if (!text) {
                alert('Escribe un mensaje de respuesta.');
                return;
            }

            const reply = {
                text: text,
                date: new Date().toISOString()
            };

            db.collection('messages').doc(messageId).update({
                replies: firebase.firestore.FieldValue.arrayUnion(reply)
            }).then(() => {
                textarea.value = '';
                loadMessages();
            }).catch((error) => {
                console.error('Error al enviar respuesta:', error);
                alert('Error al enviar la respuesta.');
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // El login se maneja manualmente
        });
    </script>
</body>
</html>
